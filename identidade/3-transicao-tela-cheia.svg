<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="-64 -64 192 192" role="img" aria-label="PDV Lojista — 3. Transição de Tela Cheia">
  <defs>
    <clipPath id="clipBox3">
      <rect class="bg-box" width="64" height="64" rx="16" />
    </clipPath>
    <style>
      .bg-box {
        transform-origin: 32px 32px;
        animation: expandBg3 2.4s cubic-bezier(0.34, 1.45, 0.64, 1) infinite;
      }
      .part-l {
        transform-origin: 26px 32px;
        animation: slideL3 2.4s cubic-bezier(0.34, 1.45, 0.64, 1) infinite;
      }
      .part-store {
        animation: slideStore3 2.4s cubic-bezier(0.34, 1.45, 0.64, 1) infinite;
      }
      @keyframes expandBg3 {
        0% { transform: scale(0); opacity: 0; }
        8% { opacity: 1; }
        24%, 56% { transform: scale(1); opacity: 1; }
        62% { transform: scale(0.92); opacity: 1; }
        84% { transform: scale(6); opacity: 1; }
        98%, 100% { transform: scale(6); opacity: 0; }
      }
      @keyframes slideL3 {
        0%, 4% { transform: translateX(-56px); opacity: 0; }
        12% { opacity: 1; }
        27%, 62% { transform: translateX(0px); opacity: 1; }
        78%, 100% { transform: translateX(-20px); opacity: 0; }
      }
      @keyframes slideStore3 {
        0%, 8% { transform: translate(86px, 12px) scale(0.96); opacity: 0; }
        16% { opacity: 1; }
        30%, 62% { transform: translate(30px, 12px) scale(0.96); opacity: 1; }
        78%, 100% { transform: translate(50px, 12px) scale(0.96); opacity: 0; }
      }
    </style>
  </defs>
  <rect class="bg-box" width="64" height="64" rx="16" fill="#7C3AED" />
  <g clip-path="url(#clipBox3)">
    <path class="part-l" d="M16 15H26V39H48V49H16Z" fill="#FFFFFF" />
    <g class="part-store">
