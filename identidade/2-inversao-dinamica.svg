<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="-16 -16 96 96" role="img" aria-label="PDV Lojista — 2. Inversão Dinâmica">
  <defs>
    <clipPath id="clipBox2">
      <rect class="bg-box" width="64" height="64" rx="16" />
    </clipPath>
    <style>
      .bg-box {
        transform-origin: 32px 32px;
        animation: scaleBg2 2.4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .part-l {
        transform-origin: 26px 32px;
        animation: slideL2 2.4s cubic-bezier(0.34, 1.45, 0.64, 1) infinite;
      }
      .part-store {
        animation: slideStore2 2.4s cubic-bezier(0.34, 1.45, 0.64, 1) infinite;
      }
      @keyframes scaleBg2 {
        0%, 95%, 100% { transform: scale(0); opacity: 0; }
        8% { opacity: 1; }
        24%, 68% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.03); opacity: 1; }
        88% { opacity: 1; }
      }
      @keyframes slideL2 {
        0%, 5%, 92%, 100% { transform: translateX(-56px) scaleX(1.15); opacity: 0; }
        12% { opacity: 1; }
        28%, 68% { transform: translateX(0px) scaleX(1); opacity: 1; }
        82% { opacity: 1; }
        90% { transform: translateX(-56px) scaleX(1.1); opacity: 0; }
      }
      @keyframes slideStore2 {
        0%, 9%, 94%, 100% { transform: translate(86px, 12px) scale(0.96); opacity: 0; }
        16% { opacity: 1; }
        32%, 68% { transform: translate(30px, 12px) scale(0.96); opacity: 1; }
        84% { opacity: 1; }
        92% { transform: translate(86px, 12px) scale(0.96); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Camada Externa em Roxo (visível fora da caixa) -->
  <g>
    <path class="part-l" d="M16 15H26V39H48V49H16Z" fill="#7C3AED" />
    <g class="part-store">
      <path d="M3 12H21V23H3Z M6 23V16Q6 15 7 15H10Q11 15 11 16V23Z M14.7 15H17.3Q18 15 18 15.7V19.3Q18 20 17.3 20H14.7Q14 20 14 19.3V15.7Q14 15 14.7 15Z" fill="#7C3AED" fill-rule="evenodd" />
      <path d="M4 2H9L8 9C7.5 12 0 12 1 9Z M10 2H14L15 9C16 12 8 12 9 9Z M15 2H20L23 9C24 12 16.5 12 16 9Z" fill="#7C3AED" />
    </g>
  </g>

  <!-- Caixa Roxa + Camada Interna Invertida em Branco -->
  <rect class="bg-box" width="64" height="64" rx="16" fill="#7C3AED" />
  <g clip-path="url(#clipBox2)">
    <path class="part-l" d="M16 15H26V39H48V49H16Z" fill="#FFFFFF" />
    <g class="part-store">
      <path d="M3 12H21V23H3Z" fill="#FFFFFF" />
      <path d="M6 23V16Q6 15 7 15H10Q11 15 11 16V23Z" fill="#7C3AED" />
      <rect x="14" y="15" width="4" height="5" rx=".7" fill="#7C3AED" />
      <path d="M4 2H9L8 9C7.5 12 0 12 1 9Z M10 2H14L15 9C16 12 8 12 9 9Z M15 2H20L23 9C24 12 16.5 12 16 9Z" fill="#FFFFFF" />
    </g>
  </g>
</svg>
