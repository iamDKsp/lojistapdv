<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64" role="img" aria-label="PDV Lojista — 1. Loop de Carregamento">
  <defs>
    <clipPath id="clipBox1">
      <rect class="bg-box" width="64" height="64" rx="16" />
    </clipPath>
    <style>
      .bg-box {
        transform-origin: 32px 32px;
        animation: scaleBg1 2.4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .part-l {
        transform-origin: 26px 32px;
        animation: slideL1 2.4s cubic-bezier(0.34, 1.45, 0.64, 1) infinite;
      }
      .part-store {
        animation: slideStore1 2.4s cubic-bezier(0.34, 1.45, 0.64, 1) infinite;
      }
      @keyframes scaleBg1 {
        0%, 95%, 100% { transform: scale(0); opacity: 0; }
        8% { opacity: 1; }
        24%, 68% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.03); opacity: 1; }
        88% { opacity: 1; }
      }
      @keyframes slideL1 {
        0%, 5%, 92%, 100% { transform: translateX(-56px) scaleX(1.15); opacity: 0; }
        12% { opacity: 1; }
        28%, 68% { transform: translateX(0px) scaleX(1); opacity: 1; }
        82% { opacity: 1; }
        90% { transform: translateX(-56px) scaleX(1.1); opacity: 0; }
      }
      @keyframes slideStore1 {
        0%, 9%, 94%, 100% { transform: translate(86px, 12px) scale(0.96); opacity: 0; }
        16% { opacity: 1; }
        32%, 68% { transform: translate(30px, 12px) scale(0.96); opacity: 1; }
        84% { opacity: 1; }
        92% { transform: translate(86px, 12px) scale(0.96); opacity: 0; }
      }
    </style>
  </defs>
  <rect class="bg-box" width="64" height="64" rx="16" fill="#7C3AED" />
  <g clip-path="url(#clipBox1)">
    <path class="part-l" d="M16 15H26V39H48V49H16Z" fill="#FFFFFF" />
    <g class="part-store">
      <path d="M3 12H21V23H3Z" fill="#FFFFFF" />
      <path d="M6 23V16Q6 15 7 15H10Q11 15 11 16V23Z" fill="#7C3AED" />
      <rect x="14" y="15" width="4" height="5" rx=".7" fill="#7C3AED" />
      <path d="M4 2H9L8 9C7.5 12 0 12 1 9Z M10 2H14L15 9C16 12 8 12 9 9Z M15 2H20L23 9C24 12 16.5 12 16 9Z" fill="#FFFFFF" />
    </g>
  </g>
</svg>
