<svg xmlns="http://www.w3.org/2000/svg" width="416" height="144" viewBox="0 0 416 144" role="img" aria-label="PDV Lojista — 4. Logo Completa Animada">
  <defs>
    <clipPath id="clipBox4">
      <rect class="bg-box" width="64" height="64" rx="16" />
    </clipPath>
    <style>
      .bg-box {
        transform-origin: 32px 32px;
        animation: scaleBg4 2.4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .part-l {
        transform-origin: 26px 32px;
        animation: slideL4 2.4s cubic-bezier(0.34, 1.45, 0.64, 1) infinite;
      }
      .part-store {
        animation: slideStore4 2.4s cubic-bezier(0.34, 1.45, 0.64, 1) infinite;
      }
      .word-pdv {
        animation: revealText4 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .word-lojista {
        animation: revealText4 2.4s cubic-bezier(0.22, 1, 0.36, 1) 0.05s infinite;
      }
      @keyframes scaleBg4 {
        0%, 95%, 100% { transform: scale(0); opacity: 0; }
        8% { opacity: 1; }
        24%, 68% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.03); opacity: 1; }
        88% { opacity: 1; }
      }
      @keyframes slideL4 {
        0%, 5%, 92%, 100% { transform: translateX(-56px) scaleX(1.15); opacity: 0; }
        12% { opacity: 1; }
        28%, 68% { transform: translateX(0px) scaleX(1); opacity: 1; }
        82% { opacity: 1; }
        90% { transform: translateX(-56px) scaleX(1.1); opacity: 0; }
      }
      @keyframes slideStore4 {
        0%, 9%, 94%, 100% { transform: translate(86px, 12px) scale(0.96); opacity: 0; }
        16% { opacity: 1; }
        32%, 68% { transform: translate(30px, 12px) scale(0.96); opacity: 1; }
        84% { opacity: 1; }
        92% { transform: translate(86px, 12px) scale(0.96); opacity: 0; }
      }
      @keyframes revealText4 {
        0%, 16%, 86%, 100% { transform: translateX(20px); opacity: 0; }
        32%, 68% { transform: translateX(0px); opacity: 1; }
      }
    </style>
  </defs>

  <g transform="translate(8 8) scale(2)">
    <rect class="bg-box" width="64" height="64" rx="16" fill="#7C3AED" />
    <g clip-path="url(#clipBox4)">
      <path class="part-l" d="M16 15H26V39H48V49H16Z" fill="#FFFFFF" />
      <g class="part-store">
        <path d="M3 12H21V23H3Z" fill="#FFFFFF" />
        <path d="M6 23V16Q6 15 7 15H10Q11 15 11 16V23Z" fill="#7C3AED" />
        <rect x="14" y="15" width="4" height="5" rx=".7" fill="#7C3AED" />
        <path d="M4 2H9L8 9C7.5 12 0 12 1 9Z M10 2H14L15 9C16 12 8 12 9 9Z M15 2H20L23 9C24 12 16.5 12 16 9Z" fill="#FFFFFF" />
      </g>
    </g>
  </g>

  <text class="word-pdv" x="163" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" letter-spacing="5" fill="#272321">PDV</text>
  <text class="word-lojista" x="159" y="113" font-family="Segoe UI,Arial,sans-serif" font-size="65" font-weight="600" letter-spacing="-2" fill="#272321">lojista</text>
</svg>
